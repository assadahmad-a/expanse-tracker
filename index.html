
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123c91">
</head>

<body>

    <!-- SVG ICON LIBRARY -->
    <svg xmlns="http://www.w3.org/2000/svg"
         style="display:none">

        <symbol id="wallet" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="15"
                  rx="3" fill="none" stroke="currentColor"
                  stroke-width="1.8"/>
            <path d="M3 9h18M16 14h.01"
                  fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round"/>
            <path d="M6 5V3h11"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
        </symbol>

        <symbol id="bell" viewBox="0 0 24 24">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M10 21h4"
                  stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round"/>
        </symbol>

      <symbol id="settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"
            fill="none" stroke="currentColor"
            stroke-width="1.8"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
          fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linejoin="round"/>
</symbol>

        <symbol id="arrow-up" viewBox="0 0 24 24">
            <path d="M12 19V5m-7 7 7-7 7 7"
                  fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </symbol>

        <symbol id="arrow-down" viewBox="0 0 24 24">
            <path d="M12 5v14m-7-7 7 7 7-7"
                  fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </symbol>

        <symbol id="plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"
                  fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round"/>
        </symbol>

        <symbol id="minus" viewBox="0 0 24 24">
            <path d="M5 12h14"
                  fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round"/>
        </symbol>

        <symbol id="clock" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"
                    fill="none" stroke="currentColor"
                    stroke-width="1.8"/>
            <path d="M12 7v5l3 2"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
        </symbol>

        <symbol id="home" viewBox="0 0 24 24">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linejoin="round"/>
        </symbol>

        <symbol id="chart" viewBox="0 0 24 24">
            <path d="M4 20V11h4v9Zm6 0V4h4v16Zm6 0V8h4v12Z"
                  fill="currentColor"/>
        </symbol>

        <symbol id="history" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
            <path d="M3 3v5h5m4-1v5l3 2"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </symbol>

        <symbol id="user" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"
                    fill="none" stroke="currentColor"
                    stroke-width="1.8"/>
            <path d="M4 21a8 8 0 0 1 16 0"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
        </symbol>

        <symbol id="shopping" viewBox="0 0 24 24">
            <path d="M3 4h2l2.5 11h11L21 8H6"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round"/>
            <circle cx="9" cy="19" r="1.5" fill="currentColor"/>
            <circle cx="18" cy="19" r="1.5" fill="currentColor"/>
        </symbol>

        <symbol id="briefcase" viewBox="0 0 24 24">
            <rect x="3" y="7" width="18" height="14"
                  rx="2" fill="none" stroke="currentColor"
                  stroke-width="1.8"/>
            <path d="M8 7V4h8v3M3 12h18m-10-1v3"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
        </symbol>

        <symbol id="food" viewBox="0 0 24 24">
            <path d="M5 3v7m3-7v7M5 7h3m-1.5 3v11M16 3v18m0-18c4 3 4 7 0 9"
                  fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </symbol>

    </svg>


    <div class="app-container">

        <!-- HEADER -->
        <header class="app-header">

            <div class="logo icon-circle">
                <svg><use href="#wallet"></use></svg>
            </div>

            <div class="header-text">
                <h1>Expense Tracker</h1>
                <p>Track · Manage · Save</p>
            </div>

            <div class="header-actions">
                <button id="notificationBtn">
                    <svg><use href="#bell"></use></svg>
                </button>

                <button id="settingsBtn">
                    <svg><use href="#settings"></use></svg>
                </button>
            </div>

        </header>


        <!-- BALANCE -->
        <section class="balance-card">
            <h3>Current Balance</h3>
            <h2 id="balance">Rs. 0</h2>
            <span>Your financial overview</span>
        </section>


        <!-- SUMMARY -->
        <section class="summary-cards">

            <div class="summary-card income-card">

                <div class="summary-icon">
                    <svg><use href="#arrow-up"></use></svg>
                </div>

                <div>
                    <h3>Total Income</h3>
                    <h2 id="totalIncome">Rs. 0</h2>
                </div>

            </div>

            <div class="summary-card expense-card">

                <div class="summary-icon">
                    <svg><use href="#arrow-down"></use></svg>
                </div>

                <div>
                    <h3>Total Expenses</h3>
                    <h2 id="totalExpense">Rs. 0</h2>
                </div>

            </div>

        </section>


        <!-- ACTION BUTTONS -->
        <section class="action-buttons">

            <button id="addIncomeBtn">
                <span class="action-icon">
                    <svg><use href="#plus"></use></svg>
                </span>
                Add Income
            </button>

            <button id="addExpenseBtn">
                <span class="action-icon">
                    <svg><use href="#minus"></use></svg>
                </span>
                Add Expense
            </button>

        </section>


        <!-- TRANSACTIONS -->
        <section class="transactions-card">

            <div class="section-header">

                <h3>
                    <svg class="heading-icon">
                        <use href="#clock"></use>
                    </svg>
                    Recent Transactions
                </h3>

                <button id="viewAllBtn">View All →</button>

            </div>

            <div id="transactionList">

                <p class="empty-message">
                    No transactions yet.
                </p>

            </div>

        </section>


        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">

            <button class="nav-btn active" data-page="home">
                <svg><use href="#home"></use></svg>
                <span>Home</span>
            </button>

            <button class="nav-btn" data-page="reports">
                <svg><use href="#chart"></use></svg>
                <span>Reports</span>
            </button>

            <button class="nav-btn" data-page="history">
                <svg><use href="#history"></use></svg>
                <span>History</span>
            </button>

            <button class="nav-btn" data-page="profile">
                <svg><use href="#user"></use></svg>
                <span>Profile</span>
            </button>

        </nav>

    </div>

    <script src="script.js"></script>

</body>
</html>
